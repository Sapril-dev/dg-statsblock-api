name: SmarterASP API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Simulation Web Deploy ou deploiement du site7
        type: choice
        options: [simulate, deploy]
        default: simulate
        required: true

permissions:
  contents: read

concurrency:
  group: api-${{ github.event_name == 'workflow_dispatch' && 'smarterasp-site7' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DunorGames.slnx
      - run: dotnet test DunorGames.slnx --configuration Release --no-restore
      - run: dotnet publish src/DunorGames.Api/DunorGames.Api.csproj --configuration Release --no-restore --output release /p:EnvironmentName=Production
      - name: Check IIS publish content
        shell: pwsh
        run: |
          foreach ($file in @('release/DunorGames.Api.dll', 'release/web.config', 'release/appsettings.Production.json')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing publish output: $file" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-${{ github.sha }}
          path: release/
      - name: Ensure Web Deploy is installed
        shell: powershell
        run: |
          $library = Join-Path $env:ProgramFiles 'IIS\Microsoft Web Deploy V3\Microsoft.Web.Deployment.dll'
          if (-not (Test-Path -LiteralPath $library)) {
            choco install webdeploy --version=3.6.0 --yes --no-progress --limit-output
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Web Deploy installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $library)) { throw 'Web Deploy library is unavailable.' }
          exit 0
      - name: Simulate or publish site7 using Web Deploy
        shell: powershell
        env:
          SMARTERASP_WEBDEPLOY_SITE_NAME: ${{ secrets.SMARTERASP_WEBDEPLOY_SITE_NAME }}
          SMARTERASP_WEBDEPLOY_URL: ${{ secrets.SMARTERASP_WEBDEPLOY_URL }}
          SMARTERASP_WEBDEPLOY_USERNAME: ${{ secrets.SMARTERASP_WEBDEPLOY_USERNAME }}
          SMARTERASP_WEBDEPLOY_PASSWORD: ${{ secrets.SMARTERASP_WEBDEPLOY_PASSWORD }}
          DEPLOYMENT_MODE: ${{ inputs.mode }}
        run: ./scripts/Deploy-SmarterAsp.ps1 -PublishPath ./release -Mode $env:DEPLOYMENT_MODE
      - name: Check public API health
        if: inputs.mode == 'deploy'
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 https://sa8techno-001-site7.gtempurl.com/health
          if ($LASTEXITCODE -ne 0) { throw 'API health check failed.' }
